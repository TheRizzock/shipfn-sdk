[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shipfn"
dynamic = ["version"]
description = "Decorate Python functions and push them to Shipfn: forms, schedules and run history for your team."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shipfn = "shipfn.cli:main"

[tool.setuptools.packages.find]
include = ["shipfn*"]

[tool.setuptools.package-data]
shipfn = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "shipfn.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
